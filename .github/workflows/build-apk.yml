name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL to convert'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'WebToAPK App'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Website URL & App Name
        run: |
          echo "Injecting URL: ${{ github.event.inputs.web_url }}"
          echo "Injecting App Name: ${{ github.event.inputs.app_name }}"
          
          # Replace App Name in strings.xml
          sed -i 's|WebToAPK App|${{ github.event.inputs.app_name }}|g' android/app/src/main/res/values/strings.xml || true
          
          # Replace Website URL in MainActivity.java
          sed -i 's|https://example.com|${{ github.event.inputs.web_url }}|g' android/app/src/main/java/com/example/webtoapk/MainActivity.java || true

      - name: Build APK with Gradle Action
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
