name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL to convert'
        required: true
        default: 'https://rlay2770-beep.github.io/my_social_app/'
      app_name:
        description: 'App Name'
        required: true
        default: 'my_social_app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Native WebToAPK Android Project
        run: |
          mkdir -p android/app/src/main/java/com/example/webtoapk
          mkdir -p android/app/src/main/res/values

          # 1. Root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 2. settings.gradle
          cat << 'EOF' > android/settings.gradle
          rootProject.name = "WebToAPK"
          include ':app'
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.example.webtoapk'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.webtoapk"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 4. strings.xml
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          # 5. AndroidManifest.xml (Icon ပါဝင်အောင် ပြင်ဆင်ထားသည်)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.webtoapk">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/example/webtoapk/MainActivity.java
          package com.example.webtoapk;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.Activity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${{ github.event.inputs.web_url }}");
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
